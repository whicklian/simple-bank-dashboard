<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Banking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Simple Bank Dashboard</h1>

        <div class="card">
            <h2>Account Balances</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Holder Name</th>
                        <th>Balance ($)</th>
                    </tr>
                </thead>
                <tbody id="accounts-table-body">

                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Tranfer funds</h2>

            <form  id="transfer-form">
                <div class="form-group">
                    <label for="from-account">From Account ID:</label>
                    <input type="number" id="from-account" required>
                </div>

                 <div class="form-group">
                    <label for="to-account">To Account ID:</label>
                    <input type="number" id="to-account" required>
                </div>

                 <div class="form-group">
                    <label for="amount">Amount ($):</label>
                    <input type="number" step="0.01" id="amount" required>
                </div>

                <button type="submit">Send Money</button>
            </form>

            <p id="message" class="hidden"></p>
            <div id="transfer-message"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
